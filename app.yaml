runtime: python311
service_account: backend-runner@avoor-app.iam.gserviceaccount.com

# F1 is too weak to run the backend, so F2 is required.
instance_class: F2

handlers:

  # This configures Google App Engine to serve the public directory.
  - url: /public
    static_dir: public

  # This routes all requests not caught above to the Avoor server.
  - url: /.*
    script: auto

# A custom entry point is required for this app
entrypoint: python3 -m server

# Enable App Engine specific APIs.
app_engine_apis: true

# Allow usage of the mail API.
inbound_services:
- mail
- mail_bounce

env_variables:
  # Enable the SMTP service.
  APPENGINE_USE_SMTP_MAIL_SERVICE: "true"

  # --- SMTP Server Configuration ---
  # The server address
  APPENGINE_SMTP_HOST: "smtp.dreamhost.com"

  # The recommended port for TLS connections
  APPENGINE_SMTP_PORT: "587"

  # The username for your SMTP login
  APPENGINE_SMTP_USER: "noreply@avoor.app"

  # The password (in Google secret manager)
  APPENGINE_SMTP_PASSWORD: "projects/238504879081/secrets/SMTP_PASSWORD/versions/latest"

  # Use TLS for a secure connection
  APPENGINE_SMTP_USE_TLS: "true"
